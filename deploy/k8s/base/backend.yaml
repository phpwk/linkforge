apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: linkforge
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: linkforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
      annotations:
        prometheus.io/scrape: "true" # belt-and-suspenders for setups without the ServiceMonitor CRD
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Placeholder — the CD pipeline rewrites this to a digest-pinned
          # ghcr.io/<owner>/linkforge-api@sha256:... via `kustomize edit set image`.
          image: ghcr.io/phpwk/linkforge-api:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: linkforge-db-credentials
          env:
            - name: PGHOST
              value: postgres-0.postgres.linkforge.svc.cluster.local
            - name: PGUSER
              value: linkforge
            - name: PGDATABASE
              value: linkforge
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: linkforge
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: linkforge
data:
  PORT: "8080"
  PGPORT: "5432"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: linkforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: linkforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
