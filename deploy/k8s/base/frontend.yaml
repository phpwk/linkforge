apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: linkforge
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: linkforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # matches nginx:alpine's built-in nginx user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/phpwk/linkforge-web:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # nginx needs to write its own cache/pid dirs; unlike the
            # backend this can't be a fully read-only rootfs without
            # also mounting emptyDirs over /var/cache/nginx and /var/run.
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: linkforge
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: linkforge
data:
  # Overridden per-environment in overlays/{dev,prod} to point at that
  # environment's api Ingress host.
  API_BASE_URL: "https://api.dev.linkforge.example"
