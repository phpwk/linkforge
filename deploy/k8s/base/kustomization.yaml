apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: linkforge

resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: linkforge
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
