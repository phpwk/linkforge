# NOTE ON THIS FILE: a hand-rolled StatefulSet is the honest minimum
# for a self-contained demo that runs on any cluster with no extra
# CRDs. It is NOT what I'd run in production. For anything real,
# replace this with either a managed database (Cloud SQL, RDS) or
# a proper operator (CloudNativePG, Zalando postgres-operator) that
# gives you failover, backups, and point-in-time recovery for free.
# This StatefulSet gives you exactly one Pod and no failover story.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: linkforge
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: linkforge
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: linkforge-db-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoids "lost+found" tripping up initdb on a fresh volume
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "linkforge", "-d", "linkforge"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "linkforge", "-d", "linkforge"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: linkforge
spec:
  clusterIP: None # headless — StatefulSet gives us a stable postgres-0.postgres DNS name
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: linkforge
data:
  POSTGRES_DB: linkforge
  POSTGRES_USER: linkforge
---
# Placeholder ONLY — do not commit real credentials to git, here or
# anywhere else. In this repo's actual CD pipeline this resource is
# not applied from this file at all; see ARCHITECTURE.md "Secrets"
# for the External Secrets Operator setup this stands in for.
apiVersion: v1
kind: Secret
metadata:
  name: linkforge-db-credentials
  namespace: linkforge
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME_replace_via_external_secrets_or_sealed_secrets
  PGPASSWORD: CHANGE_ME_replace_via_external_secrets_or_sealed_secrets
