server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Not app data, doesn't need SPA fallback or caching — served fresh
    # every request so a redeploy's new API_BASE_URL takes effect
    # immediately without users needing a hard refresh of index.html.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed filenames (Vite's default) are safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SPA fallback: any path that isn't a real file goes to index.html
    # so client-side routing (if added later) doesn't 404 on refresh.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
